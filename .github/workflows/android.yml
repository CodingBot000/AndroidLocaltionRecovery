name: Android and JVM checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Verify Android SDK tools
        run: sdkmanager --version
      - name: Verify fixture sources
        run: |
          sha256sum --check docs/legacy-fixtures.sha256
          python3 -B tools/extended/generate.py --output "$RUNNER_TEMP/generated-fixtures"
          diff -r fixtures/extended "$RUNNER_TEMP/generated-fixtures"
          python3 -B tools/extended/check_terrain.py
          python3 -B tools/osm/verify.py
      - name: Build and validate
        run: >-
          ./gradlew verifyModuleBoundaries :core:map:test :core:location:test :core:simulation:test
          :feature:lab:testDebugUnitTest :ui:map:testDebugUnitTest :app:testDebugUnitTest
          :feature:lab:lintDebug :ui:map:lintDebug :app:lintDebug :app:assembleDebug
          :app:assembleRelease :app:assembleDebugAndroidTest :benchmark:assembleBenchmark
      - name: Verify APK assets and offline manifest
        run: python3 tools/check_apk.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Run legacy evaluation
        run: ./gradlew :core:simulation:run --args='fixtures/evaluation build/reports/evaluation.json build/reports/evaluation.md'
      - name: Run legacy demo evaluation
        run: ./gradlew :core:simulation:run --args='fixtures/development build/reports/legacy-demo.json build/reports/legacy-demo.md'
      - name: Run extended evaluation
        run: ./gradlew :core:simulation:run --args='fixtures/extended build/reports/extended.json build/reports/extended.md'
      - name: Run offline OSM evaluation
        run: ./gradlew :core:simulation:run --args='fixtures/osm build/reports/osm-evaluation.json build/reports/osm-evaluation.md'
      - name: Run OSM challenge holdout
        run: ./gradlew :core:simulation:run --args='fixtures/osm/challenge build/reports/osm-challenge.json build/reports/osm-challenge.md'
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/test-results/**
            app/build/reports/**
            feature/lab/build/reports/lint-results-debug.*
            ui/map/build/reports/lint-results-debug.*
            build/reports/evaluation.*
            build/reports/legacy-demo.*
            build/reports/extended.*
            build/reports/osm-evaluation.*
            build/reports/osm-challenge.*
