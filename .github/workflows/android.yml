name: Android and JVM checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and validate
        run: ./gradlew :core:location:test :core:simulation:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Run independent evaluation
        run: ./gradlew :core:simulation:run --args='fixtures/evaluation build/reports/evaluation.json build/reports/evaluation.md'
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/test-results/**
            app/build/reports/**
            build/reports/evaluation.*
